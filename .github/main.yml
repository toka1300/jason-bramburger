on: push
name: 🚀 Deploy website on push
jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4
    
    - name: 📂 Sync files
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: https://cdaftp.concordia.ca/file
        server-dir: d/My%20CDA%20Share/public_html/ #Not sure this is right?
        username: jbrambur
        password: ${{ secrets.ftp_password }}
        exclude: |
          **/src/**
          **/.eleventry.js*
          **/.gitignore*
          **/.LICENSE.md*
          **/.README.md*
          **/.package-lock.json*
          **/package.json*